<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PishangSMP</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div><br><br>
        <p>Building Blocks... (<span id="loader-percent">0%</span>)</p>
    </div>

    <div class="content" id="content">
        <video class="bg-video" id="videobg" autoplay muted loop playsinline>
            <source src="./assets/videos/BND4.mp4" type="video/mp4">
        </video>
        <div class="bg-overlay"></div>

        <nav class="desktop-nav">
            <div class="nav-left">
                <ul>
                    <li><img class="nav-logo" src="./assets/images/minecraft-text.png" alt="PishangSMP"></li>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#events">EVENTS</a></li>
                    <li><a href="#about">ABOUT</a></li>
                </ul>
            </div>

            <div class="nav-right">
                <a href="https://discord.gg/aFvDpVqvN6" class="nav-button-block">JOIN</a>
            </div>
        </nav>

        <nav class="mobile-nav">
            <div class="nav-left">
                <ul>
                    <a href="#" style="width: 40px" class="nav-button-block"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 6l16 0" />
                        <path d="M4 12l16 0" />
                        <path d="M4 18l16 0" />
                    </svg></a>
                    <li><img class="nav-logo" src="./assets/images/minecraft-text.png" alt="PishangSMP"></li>
                </ul>
            </div>

            <div class="nav-right">
                <a href="#" class="nav-button-block">JOIN</a>
            </div>
        </nav>

        <section id="top">
            <div class="top-content" data-aos="fade-up" data-aos-duration="1000">
                <p class="top-status"><span class="status-dot"></span> Fetching Server Data...</p>
                <br>
                <img src="./assets/images/minecraft-text.png" width="70%">
                <br><br>
                <p class="top-tagline">Survival Multiplayer Server Malaysia. Tiada Reset, Tiada Pay-To-Win.</p>

                <div class="top-ip">
                    <span class="top-ip-label">SERVER IP</span>
                    <span class="top-ip-value">Kene Join Discord :P</span>
                </div>

                <div class="top-actions">
                    <a href="https://discord.gg/aFvDpVqvN6" class="nav-button-block">JOIN</a>
                    <a href="https://discord.gg/aFvDpVqvN6" class="nav-button-block button-grey">DISCORD</a>
                </div>
            </div>
        </section>

        <br>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
